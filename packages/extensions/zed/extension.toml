id = "symbolic"
name = "Symbolic"
description = "The open source coding agent."
version = "1.0.0"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/SymbolicOS/symbolic/icons/symbolic.svg"

[agent_servers.symbolic.targets.darwin-aarch64]
archive = "https://github.com/SymbolicOS/symbolic/releases/download/v1.0.0/symbolic-darwin-arm64.zip"
cmd = "./symbolic"
args = ["acp"]

[agent_servers.symbolic.targets.darwin-x86_64]
archive = "https://github.com/SymbolicOS/symbolic/releases/download/v1.0.0/symbolic-darwin-x64.zip"
cmd = "./symbolic"
args = ["acp"]

[agent_servers.symbolic.targets.linux-aarch64]
archive = "https://github.com/SymbolicOS/symbolic/releases/download/v1.0.0/symbolic-linux-arm64.tar.gz"
cmd = "./symbolic"
args = ["acp"]

[agent_servers.symbolic.targets.linux-x86_64]
archive = "https://github.com/SymbolicOS/symbolic/releases/download/v1.0.0/symbolic-linux-x64.tar.gz"
cmd = "./symbolic"
args = ["acp"]

[agent_servers.symbolic.targets.windows-x86_64]
archive = "https://github.com/SymbolicOS/symbolic/releases/download/v1.0.0/symbolic-windows-x64.zip"
cmd = "./symbolic.exe"
args = ["acp"]
